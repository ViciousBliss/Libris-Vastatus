<script>window.SITE={"tier": "public", "page": "firearms", "public_html": "<p>Firearms hit harder than any bow, and a single solid hit can knock a creature out even when it has hit points to spare. This page covers how to read a gun's entry, how to shoot and reload, and what happens when a bullet lands.<\/p>\n<p><em>DMs: the behind-the-screen details live in the DM copy's notes.<\/em><\/p>\n\n<h2>Firearm Basics<\/h2>\n<p>Every firearm has two parts that matter in play. Its <b>cartridge<\/b> decides how hard it hits, and its <b>action<\/b> decides how fast you can shoot and reload. The firearms table lists both for each gun.<\/p>\n<p><b>Proficiency.<\/b> Handguns and shotguns are simple ranged weapons. Rifles, carbines, muskets, and machine guns are martial ranged weapons.<\/p>\n<p><b>Attack rolls.<\/b> Roll a d20 and add your Dexterity modifier, plus your proficiency bonus if you're proficient with the gun. Normal and long range work the same as for any other ranged weapon.<\/p>\n<p><b>Damage.<\/b> Roll the damage dice for your gun's cartridge class. Don't add your Dexterity modifier: a bullet hits just as hard whoever fires it, and your skill decides whether it hits. Bonuses from magic weapons and extra damage from features like Sneak Attack still apply.<\/p>\n<p><b>One shot per attack.<\/b> Each attack fires one round. If you get more than one attack, such as from Extra Attack, each one is a separate shot.<\/p>\n<p><b>Ammunition.<\/b> Each shot uses one cartridge. Unlike arrows, spent cartridges can't be recovered after a fight.<\/p>\n\n<h2>Cartridge Classes<\/h2>\n<p>Your gun's cartridge class sets its damage, its Knockout DC, and whether it pierces armor. The firearms table lists each gun's class.<\/p>\n<div class=\"tablewrap\"><table>\n<tr><th>Class<\/th><th>Damage<\/th><th>Knockout DC<\/th><th>Pierces armor<\/th><th>Common cartridges<\/th><\/tr>\n<tr><td>Pocket<\/td><td>2d4<\/td><td>10<\/td><td>No<\/td><td>.22 LR, .25 ACP, .32 ACP, .380 ACP<\/td><\/tr>\n<tr><td>Service<\/td><td>2d6<\/td><td>12<\/td><td>No<\/td><td>9mm, .40 S&amp;W, .45 ACP, .45 Colt<\/td><\/tr>\n<tr><td>Magnum<\/td><td>2d8<\/td><td>14<\/td><td>Yes<\/td><td>.357 Magnum, 10mm, .44 Magnum<\/td><\/tr>\n<tr><td>Intermediate<\/td><td>2d10<\/td><td>15<\/td><td>Yes<\/td><td>5.56mm, 7.62×39mm, .300 Blackout, .30-30<\/td><\/tr>\n<tr><td>Full-power<\/td><td>2d12<\/td><td>16<\/td><td>Yes<\/td><td>.308, .30-06, .300 Win Mag, .338 Lapua<\/td><\/tr>\n<tr><td>Big-bore<\/td><td>2d12<\/td><td>17<\/td><td>Yes<\/td><td>.50 Beowulf, .458 SOCOM, 12-gauge slug, .500 S&amp;W<\/td><\/tr>\n<tr><td>Anti-materiel<\/td><td>4d8<\/td><td>20<\/td><td>Yes<\/td><td>.50 BMG, .416 Barrett<\/td><\/tr>\n<tr><td>Buckshot<\/td><td>2d10 (2d6 beyond 30 ft)<\/td><td>15 (12 beyond 30 ft)<\/td><td>No<\/td><td>12-gauge buckshot<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>Knockout DC<\/b> is how hard it is to stay standing after a hit. See Knockouts.<\/li>\n<li><b>Pierces armor<\/b> means the bullet ignores the armor a target is wearing. See Armor and Cover.<\/li>\n<\/ul>\n<p>Full-power and Big-bore cartridges deal the same damage. Big-bore bullets are heavy and slow, so they knock creatures out more easily but don't carry as far.<\/p>\n\n<h2>Firearm Properties<\/h2>\n<p>Each gun's entry in the firearms table lists its action, capacity, and properties. Here's what each one means.<\/p>\n<p><b>Action.<\/b> How the gun loads its next round. It sets how long reloading takes, and some actions reload faster if your Dexterity is 13 or higher.<\/p>\n<div class=\"tablewrap\"><table>\n<tr><th>Action<\/th><th>Reloading<\/th><th>With Dexterity 13 or higher<\/th><\/tr>\n<tr><td>Muzzleloader<\/td><td>Takes your action on 2 turns<\/td><td>Takes your action on 1 turn<\/td><\/tr>\n<tr><td>Single-shot or double-barrel<\/td><td>Takes your action<\/td><td>Takes a bonus action<\/td><\/tr>\n<tr><td>Manual (bolt, lever, or pump)<\/td><td>A bonus action loads 2 rounds or a full clip<\/td><td>No change<\/td><\/tr>\n<tr><td>Revolver<\/td><td>A bonus action loads 2 rounds, or your action reloads the whole cylinder with a speedloader<\/td><td>A speedloader reload takes a bonus action<\/td><\/tr>\n<tr><td>Semi-automatic<\/td><td>Your action swaps the magazine<\/td><td>A bonus action swaps the magazine<\/td><\/tr>\n<tr><td>Automatic<\/td><td>Same as semi-automatic<\/td><td>Same as semi-automatic<\/td><\/tr>\n<\/table><\/div>\n<p><b>Capacity.<\/b> How many rounds the gun holds before you have to reload.<\/p>\n<p><b>Quick Shot.<\/b> If your Dexterity is 13 or higher, when you take the Attack action and fire a semi-automatic gun, automatic gun, or revolver that has no Recoil property, you can fire it once more as a bonus action.<\/p>\n<p><b>Burst Fire.<\/b> Automatic guns only. As an action, you spray a 10-foot cube you can see within the gun's normal range. Each creature in the cube must succeed on a DC 15 Dexterity saving throw or take the gun's damage. Burst Fire uses 10 rounds, works only if you meet the gun's Recoil number or have it braced, and never knocks anyone out.<\/p>\n<p><b>Recoil (13) or Recoil (15).<\/b> The gun kicks hard. If your Strength score is lower than the number, you have disadvantage on attack rolls with the gun unless it's braced.<\/p>\n<p><b>Braced.<\/b> The gun is too heavy to fire unsupported. You can fire it only while it's braced.<\/p>\n<p><b>Scatter.<\/b> The gun fires buckshot, so it uses the Buckshot class, whose damage and Knockout DC drop beyond 30 feet. Buckshot never has disadvantage from range, but it can't hit anything beyond 120 feet.<\/p>\n<p><b>Two-Handed.<\/b> You need both hands to fire the gun. All long guns have this property.<\/p>\n<p><b>Bracing a gun.<\/b> A gun is braced while you're prone or while you rest it on something solid next to you, like a wall, a rock, a table, or its own bipod. Firing a gun while prone doesn't give you disadvantage.<\/p>\n<p><b>Scopes.<\/b> A scope doubles a gun's normal range. Its long range stays the same.<\/p>\n\n<h2>Firearms<\/h2>\n<p>Your DM decides which guns exist in the campaign. These are typical examples, with weights rounded.<\/p>\n<div class=\"tablewrap\"><table>\n<tr><th>Firearm<\/th><th>Class<\/th><th>Range (ft)<\/th><th>Action<\/th><th>Cap.<\/th><th>Properties<\/th><th>Weight<\/th><\/tr>\n<tr><td>Pocket pistol (.380)<\/td><td>Pocket<\/td><td>30/90<\/td><td>Semi-automatic<\/td><td>6<\/td><td>—<\/td><td>1 lb<\/td><\/tr>\n<tr><td>Flintlock pistol<\/td><td>Service<\/td><td>30/90<\/td><td>Muzzleloader<\/td><td>1<\/td><td>—<\/td><td>3 lb<\/td><\/tr>\n<tr><td>Service pistol (9mm)<\/td><td>Service<\/td><td>50/150<\/td><td>Semi-automatic<\/td><td>15<\/td><td>—<\/td><td>2 lb<\/td><\/tr>\n<tr><td>Revolver (.45 Colt)<\/td><td>Service<\/td><td>50/150<\/td><td>Revolver<\/td><td>6<\/td><td>—<\/td><td>2.5 lb<\/td><\/tr>\n<tr><td>Magnum revolver (.44 Magnum)<\/td><td>Magnum<\/td><td>50/150<\/td><td>Revolver<\/td><td>6<\/td><td>Recoil (13)<\/td><td>3 lb<\/td><\/tr>\n<tr><td>Hand cannon (.500 S&amp;W)<\/td><td>Big-bore<\/td><td>50/150<\/td><td>Revolver<\/td><td>5<\/td><td>Recoil (15)<\/td><td>4.5 lb<\/td><\/tr>\n<tr><td>Musket<\/td><td>Intermediate<\/td><td>100/300<\/td><td>Muzzleloader<\/td><td>1<\/td><td>Two-handed<\/td><td>10 lb<\/td><\/tr>\n<tr><td>Lever-action carbine (.357 Magnum)<\/td><td>Intermediate<\/td><td>150/450<\/td><td>Manual<\/td><td>10<\/td><td>Two-handed<\/td><td>7 lb<\/td><\/tr>\n<tr><td>Double-barrel shotgun (12-ga)<\/td><td>Buckshot<\/td><td>120<\/td><td>Double-barrel<\/td><td>2<\/td><td>Recoil (15), Scatter, Two-handed<\/td><td>7 lb<\/td><\/tr>\n<tr><td>Pump shotgun (12-ga)<\/td><td>Buckshot<\/td><td>120<\/td><td>Manual<\/td><td>6<\/td><td>Recoil (15), Scatter, Two-handed<\/td><td>8 lb<\/td><\/tr>\n<tr><td>Carbine (5.56mm)<\/td><td>Intermediate<\/td><td>600/1,600<\/td><td>Semi-automatic<\/td><td>30<\/td><td>Two-handed<\/td><td>7 lb<\/td><\/tr>\n<tr><td>Light machine gun (5.56mm)<\/td><td>Intermediate<\/td><td>600/1,600<\/td><td>Automatic<\/td><td>100<\/td><td>Two-handed<\/td><td>17 lb<\/td><\/tr>\n<tr><td>Hunting rifle (.30-06)<\/td><td>Full-power<\/td><td>1,000/2,600<\/td><td>Manual<\/td><td>5<\/td><td>Recoil (13), Two-handed<\/td><td>8 lb<\/td><\/tr>\n<tr><td>Battle rifle (.308)<\/td><td>Full-power<\/td><td>1,000/2,600<\/td><td>Semi-automatic<\/td><td>20<\/td><td>Recoil (13), Two-handed<\/td><td>10 lb<\/td><\/tr>\n<tr><td>Big-bore rifle (.50 Beowulf)<\/td><td>Big-bore<\/td><td>200/600<\/td><td>Semi-automatic<\/td><td>7<\/td><td>Recoil (15), Two-handed<\/td><td>8 lb<\/td><\/tr>\n<tr><td>Anti-materiel rifle (.50 BMG)<\/td><td>Anti-materiel<\/td><td>2,000/6,000<\/td><td>Semi-automatic<\/td><td>10<\/td><td>Braced, Two-handed<\/td><td>30 lb<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>Slugs.<\/b> A shotgun loaded with slugs uses the Big-bore class with a range of 200/600, and it loses the Scatter property.<\/li>\n<li><b>Long barrels.<\/b> A cartridge fired from a rifle barrel can move up a class. That's why the .357 Magnum lever-action counts as Intermediate.<\/li>\n<li><b>Rifles reach farther than most battle maps.<\/b> In a rifle fight, what usually matters is whether you can see the target, not how far away it is.<\/li>\n<\/ul>\n\n<h2>Knockouts<\/h2>\n<p>A gunshot can drop a creature on the spot, even when it has plenty of hit points left. Every time you hit with a firearm, the DM checks for a knockout in two steps:<\/p>\n<ol>\n<li><b>Compare the dice.<\/b> Tell the DM what you rolled on the gun's damage dice. If the total is higher than half the target's Constitution score, the target must save. Against a Large or bigger creature, your total has to beat its full Constitution score instead.<\/li>\n<li><b>The target saves.<\/b> It makes a Constitution saving throw against your cartridge's Knockout DC. On a failure, it's knocked out until the end of its next turn.<\/li>\n<\/ol>\n<p>The target takes the damage either way. A few more details:<\/p>\n<ul>\n<li>Count only the gun's own dice, not extra damage like Sneak Attack. A critical hit doubles your dice, so crits cause far more knockouts.<\/li>\n<li>If the target resists piercing damage, halve your dice total before comparing. A target that's immune to piercing damage can't be knocked out by bullets.<\/li>\n<li>Most undead, constructs, oozes, and elementals can't be knocked out. Your DM has the final say.<\/li>\n<li>Burst Fire never knocks anyone out.<\/li>\n<\/ul>\n<p><b>Knocked out.<\/b> A knocked-out creature is unconscious:<\/p>\n<ul>\n<li>It drops whatever it's holding and falls prone.<\/li>\n<li>It can't move, act, or react, and it loses concentration on any spell.<\/li>\n<li>It automatically fails Strength and Dexterity saving throws.<\/li>\n<li>Attack rolls against it have advantage, and any hit from within 5 feet is a critical hit.<\/li>\n<li>It wakes up at the end of its next turn, still prone.<\/li>\n<\/ul>\n<p><b>Wake-up protection.<\/b> After a creature wakes up from a knockout, it can't be knocked out again until the end of its next turn. Nobody gets knocked out turn after turn without a chance to act.<\/p>\n<p><b>This works both ways.<\/b> Enemies with guns can knock your character out too.<\/p>\n\n<h2>Armor and Cover<\/h2>\n<p>Big bullets go straight through armor, and thin walls won't stop them.<\/p>\n<p><b>Armor.<\/b> Pocket, Service, and Buckshot rounds have to get past armor like any other weapon. Rounds from every bigger class pierce armor: they ignore the AC bonus from nonmagical armor the target is wearing. Against those shots, the target's AC is 10 + its Dexterity modifier, plus its shield and any magic bonuses.<\/p>\n<p><em>Example:<\/em> A knight in plate armor has AC 18. Against a 9mm pistol, his AC is still 18. Against a 5.56mm carbine, it's 10, because the plate doesn't count and his Dexterity modifier is +0.<\/p>\n<p>A creature's natural armor, like a tough hide or shell, works however your DM decides.<\/p>\n<p><b>Cover.<\/b> Thin cover hides you, but it won't stop a bullet. Wood, plaster, doors, and furniture add nothing to your AC against firearms, though a shooter who can't see you still has disadvantage. Thick stone, brick, packed earth, and sandbags work as normal cover, except that anti-materiel rounds punch through brick.<\/p>\n\n<h2>Example of Play<\/h2>\n<p>Mira has Dexterity 16 and a +2 proficiency bonus, and she carries a 9mm service pistol. A bandit in leather armor stands 40 feet away.<\/p>\n<ol>\n<li><b>Attack.<\/b> The bandit is within the pistol's 50-foot normal range, and Service rounds don't pierce armor, so his AC stays 12. Mira rolls an 11 and adds +5 (Dexterity +3, proficiency +2) for 16, which hits.<\/li>\n<li><b>Damage.<\/b> She rolls the Service class's 2d6 and gets 9. She doesn't add her Dexterity, so the bandit takes 9 damage. He had 11 hit points, so he's still standing with 2.<\/li>\n<li><b>Knockout check.<\/b> The bandit's Constitution is 12, and half of that is 6. Mira's 9 beats it, so he must save.<\/li>\n<li><b>The save.<\/b> He rolls an 8 and adds his +1 for 9, which is less than the Service DC of 12. He's knocked out until the end of his next turn.<\/li>\n<\/ol>\n<p>Her pistol is semi-automatic with no Recoil property, and her Dexterity is 13 or higher, so she uses Quick Shot to fire at a second bandit with her bonus action.<\/p>"};</script>
