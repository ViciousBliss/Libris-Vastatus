<script>window.SITE={"tier": "public", "page": "npcs", "items": [{"name": "Chairman Cornelius Meridian", "house": "Meridian", "tier": "Head", "title": "Chairman", "region": "Frontier", "public": "Chairman of House Meridian, the railroad that binds the frontier together. A spare, courteous old man who receives the powerful in a private rail car and speaks of the line as life itself. The most important businessman on the frontier — and perhaps the most untouchable."}, {"name": "Doña Ysabel Sabine", "house": "Sabine", "tier": "Head", "title": "the Patrona", "region": "Frontier", "public": "The Patrona of House Sabine, matriarch of the greatest cattle empire on the frontier. A widow in black with a grandmother's warmth and a general's reach, who runs her herds and her people from a white hacienda with a working chapel. 'We tend our own,' she says — and means it."}, {"name": "The Luminary, Ambrose Radiant", "house": "Radiant", "tier": "Head", "title": "the Luminary", "region": "Frontier", "public": "The Luminary of House Radiant, the most beloved man on the frontier. A tall, luminous healer of seventy who still lays hands at the wall himself each season. 'Come to the wall, and be well' — his missions take in the desperate and turn none away."}, {"name": "First Clerk Pierpont Merrow", "house": "Merrow", "tier": "Head", "title": "First Clerk", "region": "Frontier", "public": "The First Clerk of House Merrow, the bank that holds the frontier's paper. A cold, immaculate, famously private man who keeps every promise and every debt. 'Your word, kept.'"}, {"name": "The Sky-Reader, Meyer Newcome", "house": "Newcome", "tier": "Head", "title": "the Sky-Reader", "region": "Frontier", "public": "The Sky-Reader of House Newcome, the youngest and newest fortune on the frontier, built on crater-strikes and uncanny luck. Charming, generous, and restless, with a flyer's sunburn — his people are always first to a fresh fall. 'First to the fire.'"}, {"name": "Superintendent Harlan Cole", "house": "Meridian", "tier": "Region Lord", "title": "Division Superintendent — the Rhynllo Division", "region": "VII", "public": "Superintendent of House Meridian's Rhynllo Division — the great rail yard in the northeast, hub of the whole line. A blunt, grease-handed yard man who came up through the ranks; nothing moves on the eastern line without his say."}, {"name": "Superintendent Odette Vance", "house": "Meridian", "tier": "Region Lord", "title": "Division Superintendent — the Greenreach Division", "region": "VI", "public": "Superintendent of Meridian's Greenreach Division, the richest stretch of line. Polished and charming, all timetables and tailored coats — the face Meridian shows its investors."}, {"name": "Superintendent Isaiah Ford", "house": "Meridian", "tier": "Region Lord", "title": "Division Superintendent — the Redgrass Division", "region": "II", "public": "Superintendent of Meridian's Redgrass Division, where the rail crosses Sabine's open cattle range. A lean, tired diplomat who spends his days keeping an uneasy peace with the ranchers."}, {"name": "Superintendent Greta Holm", "house": "Meridian", "tier": "Region Lord", "title": "Division Superintendent — the Spine Division", "region": "V", "public": "Superintendent of Meridian's Spine Division, fighting to drive track through the great cold mountains. A profane, brilliant engineer who commands real loyalty from her crews."}, {"name": "Superintendent August Reed", "house": "Meridian", "tier": "Region Lord", "title": "Division Superintendent — the Western Division", "region": "I", "public": "Superintendent of Meridian's lonely Western Division, out where the rail peters into crater country. A quiet, watchful man who likes the distance and does brisk freight business with the camps."}, {"name": "Chief Special Agent Boone Varley", "house": "Meridian", "tier": "House Law", "title": "Chief of the Rail Police", "region": "Frontier", "public": "The head of Meridian's railroad police — the Special Agents who keep order on every line. A granite-faced man who answers only to the Chairman."}, {"name": "Yard Bull Mose Tiller", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Rhynllo yard", "region": "VII", "public": "A huge, slow-moving rail bull who works the Rhynllo yard. Keeps the hub orderly with a look and a billy."}, {"name": "Agent Prudence \"Pru\" Daxe", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — eastern line", "region": "VII", "public": "A lean, quick railroad agent with a reputation for meanness. Rides the eastern line settling trouble."}, {"name": "Agent Cyrus Flint", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Rhynllo approaches", "region": "VII", "public": "A barrel-chested bull who works the junctions outside Rhynllo. Breaks up what needs breaking."}, {"name": "Agent Lavinia Shaw", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Greenreach line", "region": "VI", "public": "A composed, well-dressed railroad agent on the Greenreach line — more negotiator than brawler, until she isn't."}, {"name": "\"Big\" Ezra Coyle", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Greenreach yards", "region": "VI", "public": "An enormous, genial rail bull everyone in the Greenreach likes — right up until the day the line needs him not to be liked."}, {"name": "Agent Tom Rourke", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Greenreach spurs", "region": "VI", "public": "A steady, by-the-book railroad agent who works the Greenreach spur towns."}, {"name": "Agent Hettie Vane", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Redgrass line", "region": "II", "public": "A hard-bitten railroad agent who works the dangerous Redgrass stretch, where the line crosses Sabine range."}, {"name": "\"Dust\" Calloway", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Redgrass crossings", "region": "II", "public": "A whip-thin, dust-caked bull who rides the lonely Redgrass crossings."}, {"name": "Agent Ingrid Vole", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Spine end-of-track", "region": "V", "public": "A frost-bitten railroad agent who guards the Spine's slow, struggling end-of-track."}, {"name": "\"Pick\" Hannigan", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Spine camps", "region": "V", "public": "A brutal, pick-handle bull who keeps order in the lawless Spine railhead camps."}, {"name": "Agent Silas Dunmore", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Western line", "region": "I", "public": "A quiet, watchful railroad agent on the lonely Western line out toward crater country."}, {"name": "\"Quiet\" Nell Baskin", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Bargate terminus", "region": "I", "public": "A soft-spoken bull who works the far Western terminus at Bargate, end of the line."}, {"name": "Merle Fitch", "house": "Meridian", "tier": "Local", "title": "Station Agent — Rhynllo", "region": "VII", "public": "The Meridian station agent at Rhynllo yard — harried, ink-stained, runs the busiest desk on the frontier."}, {"name": "Opal Deane", "house": "Meridian", "tier": "Local", "title": "Station Agent — Leford", "region": "VII", "public": "The station agent at Leford — a sharp old woman who misses nothing on her platform."}, {"name": "Rufus Kell", "house": "Meridian", "tier": "Local", "title": "Station Agent — Cleaburg", "region": "VII", "public": "The station agent at Cleaburg — nervous, eager to please the line."}, {"name": "Bess Harrow", "house": "Meridian", "tier": "Local", "title": "Station Agent — Finch", "region": "VII", "public": "The station agent at Finch — brisk and competent, keeps the little depot spotless."}, {"name": "Amos Dunn", "house": "Meridian", "tier": "Local", "title": "Station Agent — Eulabrien", "region": "VII", "public": "The station agent at Eulabrien — a tired man working a stop the line is slowly abandoning."}, {"name": "Eli Mratz", "house": "Meridian", "tier": "Local", "title": "Station Agent — Teagrove", "region": "VI", "public": "The station agent at Teagrove junction — young, ambitious, company to the bone."}, {"name": "Dovie Shanks", "house": "Meridian", "tier": "Local", "title": "Station Agent — Goaton", "region": "VI", "public": "The station agent at Goaton — cheerful, gossipy, knows the whole district's business."}, {"name": "Thaddeus Moss", "house": "Meridian", "tier": "Local", "title": "Station Agent — Argent", "region": "VI", "public": "The station agent at Argent — fussy and precise, proud of his on-time record."}, {"name": "Winnie Coard", "house": "Meridian", "tier": "Local", "title": "Station Agent — Beabreech", "region": "I", "public": "The station agent at Beabreech, the deep-south junction — leathery and unbothered."}, {"name": "Gus Trimble", "house": "Meridian", "tier": "Local", "title": "Station Agent — Lost City / Bargate", "region": "I", "public": "The station agent at the Bargate terminus by Lost City — end-of-the-line melancholy in a man."}, {"name": "Cleo Vance", "house": "Meridian", "tier": "Local", "title": "Station Agent — Barot", "region": "I", "public": "The station agent at Barot — distant kin to the Greenreach Super and touchy about it."}, {"name": "Harlow Pike", "house": "Meridian", "tier": "Local", "title": "Station Agent — Redgrass siding", "region": "II", "public": "The station agent at the lonely Redgrass siding — jumpy, always watching the range."}, {"name": "Abel Thresh", "house": "Sabine", "tier": "Region Lord", "title": "Range Boss — the Redgrass", "region": "II", "public": "Range Boss of House Sabine over the Redgrass — the weathered cattle-country man who runs the greatest herds on the open range. Unhurried, courteous, and somehow everywhere at once."}, {"name": "Range Boss Delphine Marsh", "house": "Sabine", "tier": "Region Lord", "title": "Range Boss — the Greenreach", "region": "VI", "public": "Range Boss of House Sabine in the Greenreach, where the ranches push against the jungle and the rail. A genteel, iron-spined woman steadily expanding Sabine's range eastward."}, {"name": "Range Boss Cassius Dorn", "house": "Sabine", "tier": "Region Lord", "title": "Range Boss — the Sunder Basin", "region": "I", "public": "Range Boss of House Sabine over the thin, tough herds of the Sunder Basin, where cattle country meets crater country. A lean desert man for whom water is everything."}, {"name": "Chief Stock-Detective Lemuel Boyd", "house": "Sabine", "tier": "House Law", "title": "Chief of the Stock-Detectives", "region": "Frontier", "public": "The head of House Sabine's stock-detectives — the range riders who hunt rustlers and settle disputes out where no marshal rides. A soft-spoken man with a hangman's patience."}, {"name": "Stock-Detective Oleta Vargas", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — the Redgrass", "region": "II", "public": "A quiet, watchful range rider who works the Redgrass for Sabine, hunting rustlers."}, {"name": "Stock-Detective \"Cord\" Mercer", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — the Redgrass", "region": "II", "public": "A rope-lean range rider known for never raising his voice."}, {"name": "Stock-Detective Bram Tolliver", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — the Desolations edge", "region": "II", "public": "A grim rider who patrols the dead-flats edge of the Redgrass, where the Desolations begin."}, {"name": "Stock-Detective Reuben Ash", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — the Redgrass", "region": "II", "public": "A broad, calm rider who is always near the herd when it moves."}, {"name": "Stock-Detective Delia Sunn", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — the Greenreach", "region": "VI", "public": "A sharp, jungle-wise range rider who works Marsh's expanding Greenreach range."}, {"name": "Stock-Detective Gaius Hollis", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — the Greenreach spurs", "region": "VI", "public": "A genial, dangerous rider who works the Greenreach spur country."}, {"name": "Stock-Detective Marisol Ruiz", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — the Sunder Basin", "region": "I", "public": "A desert-hard range rider who guards Dorn's thin basin herds and their precious water."}, {"name": "Stock-Detective \"Dry\" Calder", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — crater-country range", "region": "I", "public": "A sun-blasted, laconic rider who works the edge where Sabine range meets Newcome's claims."}, {"name": "Enoch Pryor", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Thresh home ranch", "region": "II", "public": "Foreman of Sabine's great Redgrass home ranch — grizzled, fair to his hands, loyal to the brand."}, {"name": "Sadie Lum", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Dustwater spread", "region": "II", "public": "Foreman of the Dustwater spread — brisk, no-nonsense, keeps a tight crew."}, {"name": "Abner Teale", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Redgrass line camps", "region": "II", "public": "Foreman over the Redgrass line camps — weather-beaten, endlessly patient."}, {"name": "Pearl Oduya", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Breaks station", "region": "II", "public": "Foreman at the Breaks grazing station — young, ambitious, wants a detective's badge."}, {"name": "Caleb Finnan", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Witchmoor range", "region": "II", "public": "Foreman of the Witchmoor-edge range — superstitious, keeps charms on the fence posts."}, {"name": "Rosa Benteen", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Soudale pens", "region": "II", "public": "Foreman of the Soudale holding pens — sharp-eyed, runs the sorting."}, {"name": "Gideon Marsh", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Greenreach home ranch", "region": "VI", "public": "Foreman of Marsh's Greenreach home ranch — her cousin, steady and expansion-minded."}, {"name": "Twyla Reeves", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Elysian-edge range", "region": "VI", "public": "Foreman at the Elysian jungle edge — tough, malarial, half-wild."}, {"name": "Jonas Okebe", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Hato spur ranch", "region": "VI", "public": "Foreman of the Hato spur ranch — genial, trades cattle talk with every passerby."}, {"name": "Hettie Dorn", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Sunder home ranch", "region": "I", "public": "Foreman of Dorn's Sunder Basin home ranch — his sister, hard as the country."}, {"name": "Milo Vane", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the crater-edge grazing", "region": "I", "public": "Foreman over the crater-edge grazing camps — jumpy, always eyeing Newcome's claims."}, {"name": "Agnes Pell", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Dagra Waste wells", "region": "I", "public": "Foreman at the Dagra Waste wells — leathery, miserly with every drop."}, {"name": "Prelate Father Odo Wren", "house": "Radiant", "tier": "Region Lord", "title": "Prelate of the Wall — the Scald", "region": "III", "public": "The senior Prelate of House Radiant, who runs the great mission country of the Scald. A stern, luminous priest, second only to the Luminary in the people's love."}, {"name": "Prelate Mother Cerys Vale", "house": "Radiant", "tier": "Region Lord", "title": "Prelate of the Wall — the Sunder Basin", "region": "I", "public": "Prelate of House Radiant over the crater-country missions of the Sunder Basin, where the church is often the only sanctuary for a hundred miles. Beloved by the desperate."}, {"name": "Prelate Father Gideon Poole", "house": "Radiant", "tier": "Region Lord", "title": "Prelate of the Wall — the Redgrass", "region": "II", "public": "Prelate of House Radiant across the Redgrass missions, riding a long circuit between far-flung chapels. A tireless, weather-beaten shepherd."}, {"name": "Prelate Mother Junia Okonkwo", "house": "Radiant", "tier": "Region Lord", "title": "Prelate of the Wall — the Greenreach", "region": "VI", "public": "Prelate of House Radiant in the Greenreach, carrying the wall and the light into the deep jungle missions. Fervent, fearless, feverish."}, {"name": "Brother Silas Mourne", "house": "Radiant", "tier": "House Law", "title": "the First Lamp", "region": "Frontier", "public": "The First Lamp of House Radiant — head of the Lamplighters, the quiet brothers who tend the mission lamps and shepherd new converts. A gentle, smiling man."}, {"name": "Lamplighter Brother Enoch Tiller", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Scald", "region": "III", "public": "A soft-spoken Lamplighter of the Scald missions who tends the lamps and comforts the lost."}, {"name": "Lamplighter Sister Agatha Cree", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Scald", "region": "III", "public": "A patient, kindly Lamplighter who sits with the sick and the dying."}, {"name": "Lamplighter Brother Caius Veldt", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Sunder Basin", "region": "I", "public": "A watchful Lamplighter of the crater-country missions."}, {"name": "Lamplighter Sister Noor Haddad", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Sunder Basin", "region": "I", "public": "A gentle Lamplighter who runs the mission's charity kitchen."}, {"name": "Lamplighter Brother Josiah Penn", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Redgrass", "region": "II", "public": "A circuit Lamplighter who rides between the Redgrass chapels."}, {"name": "Lamplighter Sister Delphine Orr", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Redgrass", "region": "II", "public": "A brisk Lamplighter who keeps the Redgrass mission rolls."}, {"name": "Lamplighter Brother Tomas Ngai", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Greenreach", "region": "VI", "public": "A jungle Lamplighter, lean and fever-bright."}, {"name": "Lamplighter Sister Beatrix Vane", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Greenreach", "region": "VI", "public": "A devout Lamplighter who runs the deepest jungle mission."}, {"name": "Deacon Harrow Plume", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Ashmaw mission", "region": "III", "public": "Parish warden of the great Ashmaw mission — stout, devout, runs the daily charity."}, {"name": "Sister Willa Teague", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Scald chapels", "region": "III", "public": "Circuit warden of the scattered Scald chapels — kind, tireless, trusted by all."}, {"name": "Deacon Amos Reel", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Kashoy mission", "region": "III", "public": "Parish warden of the Kashoy desert mission — gruff, protective of his flock."}, {"name": "Sister Oona Blight", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the vent chapels", "region": "III", "public": "Warden of the volcanic-vent chapels — half-mad with heat and faith."}, {"name": "Deacon Ruth Calder", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Scafield mission", "region": "I", "public": "Parish warden of the Scafield boomtown mission — harried, overwhelmed, good-hearted."}, {"name": "Brother Eli Vance", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the crater missions", "region": "I", "public": "Circuit warden of the crater-country missions — young, idealistic, newly ordained."}, {"name": "Sister Marta Dune", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Devouring-edge chapel", "region": "I", "public": "Warden of the lonely chapel at the edge of the Sands of Devouring."}, {"name": "Deacon Silas Poole", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Redgrass circuit", "region": "II", "public": "Circuit warden of the Redgrass chapels — Poole's nephew, eager and loyal."}, {"name": "Sister Hannah Vey", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Desolations mission", "region": "II", "public": "Warden of the grim mission at the Desolations' edge."}, {"name": "Deacon Obed Krane", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the cattle-town chapels", "region": "II", "public": "Parish warden of the Redgrass cattle-town chapels — backslapping, well-fed."}, {"name": "Sister Adaeze Nri", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Greenreach missions", "region": "VI", "public": "Warden of the Greenreach jungle missions — brave, malarial, devoted."}, {"name": "Brother Lot Pardee", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Elysian chapel", "region": "VI", "public": "Warden of the deep Elysian-jungle chapel — isolated, half-feral, fervent."}, {"name": "Factor Hiram Blyte", "house": "Merrow", "tier": "Region Lord", "title": "Factor — the Tideward", "region": "VII", "public": "The senior Factor of House Merrow, who keeps the great ledgers of the Tideward — the bank's heartland and its deepest vaults. A precise, bloodless man who forgets nothing."}, {"name": "Factor Ophelia Creed", "house": "Merrow", "tier": "Region Lord", "title": "Factor — the Drownlands", "region": "IV", "public": "Factor of House Merrow in the Drownlands, where the bank's money moves quietly through the bayou and the river trade. A patient, smiling woman who is always owed."}, {"name": "Factor Cato Welles", "house": "Merrow", "tier": "Region Lord", "title": "Factor — the Scald", "region": "III", "public": "Factor of House Merrow across the S
