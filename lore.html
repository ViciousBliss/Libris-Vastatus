<script>window.SITE={"tier": "public", "page": "lore", "public": [{"title": "The Fallow", "body": "An altered Old West where the sky delivers. Great beasts and sudden fortunes fall from the heavens in crater-strikes, and a hard, beautiful frontier has grown up to chase them. Magic runs on dram — a physical commodity, scarce and dear — and the great Houses that supply it hold the whole country in their hands. It is a golden age, lonesome and elegiac, with a knife somewhere under it."}, {"title": "Dram", "body": "The power that lights every town wall and arms every Warden. Blood freely given heals; that much any child on the frontier knows. Dram is spell-power made physical — earned, bought, and spent, never free. Spell slots do not come back with a night's sleep out here; dram is a currency you work for, and the Houses control the supply."}, {"title": "The Seven Regions", "body": "West to east, the frontier grows more settled and more civilized. I — the Sunder Basin (salt flats and crater country). II — the Redgrass (open cattle range). III — the Scald (mission country and volcanic desert). IV — the Drownlands (bayou and black channels). V — the Spine (the great cold mountains and the oldest ruins). VI — the Greenreach (piedmont giving way to deep jungle). VII — the Tideward (the eastern seaboard and old port cities)."}, {"title": "The Five Houses", "body": "The great families that run the frontier and meet as 'the Table.' Meridian, the railroad — 'the line is life.' Sabine, the cattle empire — 'we tend our own.' Radiant, the church — 'come to the wall, and be well.' Merrow, the bank — 'your word, kept.' Newcome, the crater-rush — 'first to the fire.' Their lords are titled Wardens."}, {"title": "The Outlanders", "body": "Those outside the Houses, by reputation (the truth earned in play): the Given (saints or fools who help for nothing); the Redhand (smugglers and fences who know everyone); the Ashers (feared zealots who hunt dram and destroy it); the Press (printers and mapmakers who insist the powers hide something); the Treaty-kept (the first peoples, who owe the newcomers nothing); the marshals (thin, honest, overworked law); and the sky-cults (prophets of the falling sky)."}, {"title": "Your Companion", "body": "Every rider on the frontier keeps a beast — classed by the role it performs, not its species. It rides with you, fights on its own initiative, and carries a med-kit that keeps you alive. See the Dino Classes page for the seven roles."}]};</script>
